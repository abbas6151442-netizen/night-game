name: Build Night
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -e
          APP=build/Payload/Night.app
          mkdir -p $APP
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios15.0 -sdk "$SDK" -O -parse-as-library -swift-version 5 Game.swift -o $APP/Night
          unzip -oq assets.zip -d assets && cp assets/* $APP/
          cat > $APP/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>Night</string>
          <key>CFBundleIdentifier</key><string>com.testgame.night</string>
          <key>CFBundleName</key><string>Night</string>
          <key>CFBundleDisplayName</key><string>The Dream</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>MinimumOSVersion</key><string>15.0</string>
          <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
          <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
          <key>CFBundleIcons</key><dict><key>CFBundlePrimaryIcon</key><dict><key>CFBundleIconFiles</key><array><string>AppIcon60x60</string></array></dict></dict>
          <key>UILaunchScreen</key><dict/>
          <key>UIStatusBarHidden</key><true/>
          <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
          </dict></plist>
          EOF
          cd build && zip -qr Night.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Night
          path: build/Night.ipa
